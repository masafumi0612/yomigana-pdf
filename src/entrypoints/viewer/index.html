<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>よみがなPDF</title>
  </head>
  <body>
    <header id="bar" class="bar">
      <h1 id="file-name" class="bar-name bar-normal"></h1>
      <div id="page-group" class="bar-group" hidden>
        <input
          id="page-input"
          class="bar-field"
          type="text"
          inputmode="numeric"
          autocomplete="off"
        />
        <span id="page-total" class="bar-sub"></span>
      </div>
      <div id="zoom-group" class="bar-group" hidden>
        <button id="zoom-out" class="bar-button bar-icon" type="button">−</button>
        <output id="zoom-level" class="bar-zoom"></output>
        <button id="zoom-in" class="bar-button bar-icon" type="button">+</button>
        <button id="rotate" class="bar-button bar-rotate" type="button">
          <svg
            class="bar-rotate-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="3" y="10" width="10" height="11" rx="1.5" />
            <path d="M8 4h3a8 8 0 0 1 8 8v2" />
            <path d="M16 11l3 3 3-3" />
          </svg>
          <span id="rotate-label"></span>
        </button>
      </div>
      <div id="direction-bar" class="bar-group bar-editing" hidden>
        <p id="direction-bar-text" class="bar-editing-text" role="status"></p>
        <button
          id="direction-all-vertical"
          class="bar-button bar-edit-button"
          type="button"
        ></button>
        <button
          id="direction-all-horizontal"
          class="bar-button bar-edit-button"
          type="button"
        ></button>
        <button id="direction-done" class="bar-button bar-edit-button" type="button"></button>
      </div>
      <div id="ruby-failed" class="bar-group bar-normal" hidden>
        <span id="ruby-failed-text" class="bar-alert" role="status"></span>
        <button id="ruby-retry" class="bar-button" type="button"></button>
      </div>
      <div class="bar-group bar-normal">
        <button id="open-file" class="bar-button" type="button" hidden></button>
        <button id="open-native" class="bar-button" type="button" hidden></button>
      </div>
      <input id="file-input" type="file" accept="application/pdf,.pdf" hidden />
    </header>
    <div class="notices">
      <form id="password-form" class="notice" hidden>
        <label id="password-label" for="password-input" class="notice-text"></label>
        <input
          id="password-input"
          class="bar-field notice-field"
          type="password"
          autocomplete="off"
          required
        />
        <button id="password-submit" class="bar-button notice-button" type="submit"></button>
        <p id="password-error" class="notice-error" role="alert" hidden></p>
      </form>
      <div id="direction-notice" class="notice" hidden>
        <p id="direction-notice-text" class="notice-text" role="status"></p>
        <button id="direction-notice-start" class="bar-button notice-button" type="button"></button>
        <button id="direction-notice-close" class="bar-button notice-close" type="button">×</button>
      </div>
      <div id="no-text-notice" class="notice" hidden>
        <p id="no-text-text" class="notice-text" role="status"></p>
        <button id="no-text-close" class="bar-button notice-button" type="button"></button>
      </div>
    </div>
    <div id="direction-menu" class="menu" role="menu" hidden>
      <button id="direction-menu-item" class="menu-item" role="menuitem" type="button"></button>
    </div>
    <main>
      <p id="status" class="status" role="status" hidden></p>
      <div id="failure-actions" class="status-actions" hidden>
        <button id="failure-choose" class="bar-button status-button" type="button"></button>
        <button id="failure-native" class="bar-button status-button" type="button"></button>
      </div>
      <div id="viewer-container" class="viewer-container" tabindex="0">
        <div id="viewer" class="pdfViewer"></div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
